<svg viewBox="200 65 545 315" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="1090" height="630">
    <title>Wald mit drei Vögeln</title>
      <style>
        .bz-flake{animation-name:bzFall;animation-timing-function:linear;animation-iteration-count:infinite}
        @keyframes bzFall{0%{transform:translateY(-40px);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateY(360px);opacity:0}}
        @media (prefers-reduced-motion: reduce){.bz-flake{animation:none;opacity:.5}}
      
        .bz-flock { opacity: .82; animation-name: bzFly; animation-timing-function: linear; animation-iteration-count: infinite; }
        @keyframes bzFly {
          0% { transform: translateX(160px); opacity: 0; }
          8% { opacity: .82; }
          88% { opacity: .82; }
          100% { transform: translateX(785px); opacity: 0; }
        }
        .bz-wing { transform-box: fill-box; }
        .bz-wing-near { transform-origin: 0% 100%; animation: bzFlapNear .62s ease-in-out infinite; }
        .bz-wing-far { transform-origin: 100% 100%; animation: bzFlapFar .62s ease-in-out infinite; }
        @keyframes bzFlapNear {
          0%, 100% { transform: rotate(-10deg); }
          50% { transform: rotate(38deg); }
        }
        @keyframes bzFlapFar {
          0%, 100% { transform: rotate(38deg); }
          50% { transform: rotate(-10deg); }
        }
        @media (prefers-reduced-motion: reduce) {
          .bz-flock { animation: none; opacity: .82; transform: translateX(364px); }
          .bz-wing-near, .bz-wing-far { animation: none; }
          .bz-wing-near { transform: rotate(16deg); }
          .bz-wing-far { transform: rotate(18deg); }
        }
      </style>
      
